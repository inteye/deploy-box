<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <style>
      :root {
        --bg: #f4efe5;
        --bg-deep: #e8dcc7;
        --panel: rgba(255, 251, 244, 0.9);
        --panel-solid: #fffaf2;
        --line: #d7c8ae;
        --line-strong: #bea983;
        --ink: #182018;
        --muted: #68746c;
        --accent: #0f6a53;
        --accent-soft: #ddf2e8;
        --accent-ink: #0d5845;
        --warning: #9b6414;
        --warning-soft: #fff2dc;
        --danger: #a13027;
        --danger-soft: #fde8e3;
        --shadow: 0 22px 44px rgba(42, 30, 12, 0.08);
        --radius-lg: 22px;
        --radius-md: 16px;
        --radius-sm: 12px;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "PingFang SC", "Helvetica Neue", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(16, 106, 83, 0.18), transparent 24%),
          radial-gradient(circle at top right, rgba(177, 126, 46, 0.18), transparent 22%),
          linear-gradient(180deg, #f8f3ea 0%, var(--bg) 100%);
      }

      a { color: inherit; text-decoration: none; }
      button, input, textarea, select { font: inherit; }

      .shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 280px 1fr;
        transition: grid-template-columns .22s ease;
      }

      body.sidebar-collapsed .shell {
        grid-template-columns: 92px 1fr;
      }

      .sidebar {
        position: sticky;
        top: 0;
        height: 100vh;
        padding: 24px 18px;
        background: rgba(255, 250, 242, 0.78);
        backdrop-filter: blur(18px);
        border-right: 1px solid rgba(190, 169, 131, 0.5);
        transition: padding .22s ease;
      }

      body.sidebar-collapsed .sidebar {
        padding-inline: 12px;
      }

      .brand {
        display: grid;
        gap: 6px;
        margin-bottom: 24px;
      }

      .brand-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .brand strong {
        font-size: 28px;
        letter-spacing: -0.04em;
      }

      .brand-mark {
        display: none;
        width: 44px;
        height: 44px;
        border-radius: 14px;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, rgba(15, 106, 83, 0.14) 0%, rgba(15, 106, 83, 0.22) 100%);
        border: 1px solid rgba(15, 106, 83, 0.18);
        color: var(--accent);
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.04em;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.5);
      }

      .brand span {
        color: var(--muted);
        font-size: 13px;
      }

      body.sidebar-collapsed .brand span,
      body.sidebar-collapsed .brand-name,
      body.sidebar-collapsed .nav-label,
      body.sidebar-collapsed .sidebar-meta strong,
      body.sidebar-collapsed .sidebar-meta .sidebar-copy,
      body.sidebar-collapsed .sidebar-meta form {
        display: none;
      }

      body.sidebar-collapsed .brand {
        justify-items: center;
      }

      body.sidebar-collapsed .brand-row {
        width: 100%;
        justify-content: center;
      }

      body.sidebar-collapsed .brand strong {
        font-size: 20px;
      }

      body.sidebar-collapsed .brand-mark {
        display: inline-flex;
      }

      .nav {
        display: grid;
        gap: 10px;
      }

      .nav a {
        display: flex;
        align-items: center;
        gap: 10px;
        border-radius: 14px;
        padding: 14px 16px;
        color: var(--muted);
        border: 1px solid transparent;
        min-height: 58px;
      }

      body.sidebar-collapsed .nav a {
        justify-content: center;
        padding-inline: 12px;
      }

      .nav a.active,
      .nav a:hover {
        color: var(--accent);
        background: var(--accent-soft);
        border-color: #c2dacd;
      }

      .nav-icon {
        width: 30px;
        height: 30px;
        border-radius: 10px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: rgba(15, 106, 83, 0.08);
        color: var(--accent);
        font-size: 13px;
        font-weight: 700;
        flex: 0 0 auto;
      }

      .nav-label {
        display: grid;
        gap: 2px;
      }

      .nav-label strong {
        font-size: 14px;
      }

      .nav-label span {
        font-size: 11px;
        color: inherit;
        opacity: 0.78;
      }

      .sidebar-meta {
        margin-top: 22px;
        padding-top: 18px;
        border-top: 1px solid rgba(190, 169, 131, 0.5);
        color: var(--muted);
        font-size: 13px;
      }

      body.sidebar-collapsed .sidebar-meta {
        display: grid;
        justify-items: center;
      }

      .sidebar-copy {
        display: block;
      }

      .main {
        padding: 24px;
        min-width: 0;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 20px;
      }

      .topbar-meta {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(255,255,255,0.76);
        border: 1px solid rgba(190,169,131,0.55);
        color: var(--muted);
        font-size: 12px;
      }

      .sidebar-toggle {
        width: 40px;
        height: 40px;
        border: 1px solid rgba(190,169,131,0.55);
        border-radius: 12px;
        background: rgba(255,255,255,0.72);
        color: var(--accent-ink);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: background .18s ease, border-color .18s ease, transform .18s ease;
      }

      .sidebar-toggle:hover {
        background: var(--accent-soft);
        border-color: #c2dacd;
        transform: translateY(-1px);
      }

      .sidebar-toggle-mobile {
        display: none;
      }

      .page {
        display: grid;
        gap: 20px;
        min-width: 0;
      }

      .hero {
        display: grid;
        gap: 10px;
      }

      .eyebrow {
        display: inline-flex;
        width: fit-content;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(255,255,255,0.7);
        border: 1px solid rgba(190, 169, 131, 0.65);
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.02em;
      }

      .hero h1 {
        margin: 0;
        font-size: clamp(28px, 4vw, 42px);
        line-height: 1.05;
        letter-spacing: -0.05em;
      }

      .hero p {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
        max-width: 860px;
      }

      .card {
        background: var(--panel);
        border: 1px solid rgba(190, 169, 131, 0.55);
        border-radius: var(--radius-lg);
        padding: 20px;
        box-shadow: var(--shadow);
      }

      .card h2, .card h3 {
        margin: 0 0 12px;
        letter-spacing: -0.03em;
      }

      .card p:last-child { margin-bottom: 0; }

      .grid { display: grid; gap: 18px; }
      .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }

      .stats {
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      }

      .stat {
        display: grid;
        gap: 8px;
      }

      .stat strong {
        font-size: 30px;
        line-height: 1;
        letter-spacing: -0.04em;
      }

      .stat span {
        color: var(--muted);
        font-size: 13px;
      }

      .muted { color: var(--muted); }
      .small { font-size: 13px; }

      .notice, .error {
        padding: 14px 16px;
        border-radius: var(--radius-md);
        font-size: 14px;
      }

      .notice {
        background: var(--accent-soft);
        color: var(--accent-ink);
        border: 1px solid #b8d7c7;
      }

      .error {
        background: var(--danger-soft);
        color: var(--danger);
        border: 1px solid #f0c7bc;
      }

      .section-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      .section-head p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 13px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }

      th, td {
        text-align: left;
        padding: 12px 10px;
        border-bottom: 1px solid rgba(190, 169, 131, 0.32);
        vertical-align: top;
      }

      th {
        font-size: 12px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid #c4dbcf;
        background: #eef7f2;
        color: var(--accent-ink);
        font-size: 12px;
      }

      .badge.warning {
        background: var(--warning-soft);
        border-color: #f1d3a1;
        color: var(--warning);
      }

      .badge.failed {
        background: var(--danger-soft);
        border-color: #f0c7bc;
        color: var(--danger);
      }

      .badge.subtle {
        background: rgba(255,255,255,0.66);
        border-color: rgba(190,169,131,0.55);
        color: var(--muted);
      }

      .form-grid {
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }

      label {
        display: grid;
        gap: 8px;
        font-size: 13px;
        color: var(--muted);
      }

      input, textarea, select {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid rgba(190, 169, 131, 0.8);
        border-radius: var(--radius-sm);
        background: rgba(255,255,255,0.88);
        color: var(--ink);
      }

      input:focus, textarea:focus, select:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 4px rgba(15, 106, 83, 0.12);
      }

      textarea {
        min-height: 120px;
        resize: vertical;
      }

      .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      button, .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: 14px;
        border: 1px solid #115f4c;
        background: linear-gradient(180deg, #14735a 0%, #0f5e4b 100%);
        color: #fff;
        padding: 12px 16px;
        cursor: pointer;
        min-height: 46px;
      }

      button.secondary, .button.secondary {
        background: rgba(255,255,255,0.92);
        color: var(--accent);
        border-color: #c4d7cd;
      }

      button.ghost, .button.ghost {
        background: transparent;
        color: var(--muted);
        border-color: rgba(190,169,131,0.8);
      }

      button.danger {
        background: linear-gradient(180deg, #bb4437 0%, #9d3228 100%);
        border-color: #992f26;
      }

      .primary-stack {
        display: grid;
        gap: 14px;
      }

      .primary-actions {
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      }

      .workflow-grid {
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .workflow-card {
        display: grid;
        gap: 12px;
        padding: 18px;
        border-radius: var(--radius-md);
        border: 1px solid rgba(190,169,131,0.5);
        background:
          linear-gradient(180deg, rgba(255,255,255,0.7) 0%, rgba(255,250,242,0.52) 100%);
      }

      .workflow-step {
        display: inline-flex;
        width: fit-content;
        padding: 6px 10px;
        border-radius: 999px;
        background: #fff;
        border: 1px solid rgba(190,169,131,0.55);
        color: var(--accent);
        font-size: 12px;
        font-weight: 600;
      }

      .action-panel {
        display: grid;
        gap: 12px;
        padding: 18px;
        border-radius: var(--radius-md);
        background: rgba(255,255,255,0.58);
        border: 1px solid rgba(190,169,131,0.5);
      }

      .action-panel strong {
        font-size: 18px;
      }

      .progress-shell {
        width: 100%;
        height: 10px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(190, 169, 131, 0.25);
      }

      .progress-bar {
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, #19a07d 0%, #0f6a53 100%);
        border-radius: 999px;
        transition: width .3s ease;
      }

      .timeline {
        display: grid;
        gap: 12px;
      }

      .timeline-item {
        display: grid;
        gap: 6px;
        padding: 14px 16px;
        border-radius: var(--radius-md);
        background: rgba(255,255,255,0.56);
        border: 1px solid rgba(190,169,131,0.45);
      }

      .timeline-item strong { font-size: 14px; }

      pre {
        margin: 0;
        padding: 16px;
        border-radius: var(--radius-md);
        background: #16211c;
        color: #eef8f0;
        overflow: auto;
        font-size: 12px;
        line-height: 1.55;
      }

      details.advanced {
        border-radius: var(--radius-md);
        border: 1px solid rgba(190,169,131,0.55);
        background: rgba(255,255,255,0.5);
        padding: 14px 16px;
      }

      details.advanced > summary {
        cursor: pointer;
        font-weight: 600;
      }

      .list-stack {
        display: grid;
        gap: 12px;
      }

      .list-card {
        display: grid;
        gap: 10px;
        padding: 14px 16px;
        border-radius: var(--radius-md);
        border: 1px solid rgba(190,169,131,0.45);
        background: rgba(255,255,255,0.54);
      }

      .list-card.selected-card {
        border-color: #8db4a5;
        background: linear-gradient(180deg, rgba(232, 247, 240, 0.88) 0%, rgba(255,255,255,0.66) 100%);
        box-shadow: 0 18px 28px rgba(15, 106, 83, 0.08);
      }

      .meta-line {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        color: var(--muted);
        font-size: 13px;
      }

      .meta-grid {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }

      .guide-steps {
        margin: 0;
        padding-left: 18px;
        display: grid;
        gap: 10px;
        color: var(--ink);
      }

      .guide-steps li {
        line-height: 1.6;
      }

      .code-block {
        margin-top: 12px;
        max-height: 420px;
      }

      .tabs {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .tab {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 14px;
        border-radius: 999px;
        border: 1px solid rgba(190,169,131,0.55);
        background: rgba(255,255,255,0.66);
        color: var(--muted);
        font-size: 13px;
      }

      .tab.active {
        background: var(--accent-soft);
        color: var(--accent);
        border-color: #c2dacd;
      }

      .anchor-card {
        display: grid;
        gap: 12px;
        padding: 18px;
        border-radius: var(--radius-md);
        border: 1px solid rgba(190,169,131,0.5);
        background:
          linear-gradient(180deg, rgba(255,255,255,0.7) 0%, rgba(255,250,242,0.52) 100%);
        transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
      }

      .anchor-card:hover {
        transform: translateY(-2px);
        border-color: var(--line-strong);
        box-shadow: 0 18px 30px rgba(42, 30, 12, 0.08);
      }

      @media (max-width: 1100px) {
        .shell {
          grid-template-columns: 1fr;
        }

        body.sidebar-collapsed .shell {
          grid-template-columns: 1fr;
        }

        .sidebar {
          position: static;
          height: auto;
          border-right: 0;
          border-bottom: 1px solid rgba(190, 169, 131, 0.5);
        }

        body.sidebar-collapsed .sidebar {
          padding-inline: 18px;
        }

        body.sidebar-collapsed .brand span,
        body.sidebar-collapsed .nav-label,
        body.sidebar-collapsed .sidebar-meta strong,
        body.sidebar-collapsed .sidebar-meta .sidebar-copy,
        body.sidebar-collapsed .sidebar-meta form {
          display: initial;
        }

        body.sidebar-collapsed .nav a {
          justify-content: flex-start;
          padding-inline: 16px;
        }

        .sidebar-toggle-desktop {
          display: none;
        }

        .sidebar-toggle-mobile {
          display: inline-flex;
        }

        .topbar {
          flex-direction: column;
          align-items: flex-start;
        }
      }

      @media (max-width: 780px) {
        .main {
          padding: 16px;
        }

        .grid.two, .grid.three, .workflow-grid {
          grid-template-columns: 1fr;
        }

        table, thead, tbody, tr, th, td {
          display: block;
        }

        thead {
          display: none;
        }

        tbody {
          display: grid;
          gap: 12px;
        }

        tr {
          padding: 14px 16px;
          border-radius: var(--radius-md);
          border: 1px solid rgba(190,169,131,0.45);
          background: rgba(255,255,255,0.54);
        }

        td, th {
          border: 0;
          padding: 4px 0;
        }

        .nav {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    {% if current_user %}
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-row">
            <span class="brand-mark" aria-hidden="true">D</span>
            <strong class="brand-name">DeployBox</strong>
            <button type="button" class="sidebar-toggle sidebar-toggle-desktop" data-sidebar-toggle aria-label="收起或展开侧边栏" aria-expanded="true">≡</button>
          </div>
          <span>独立发布平台 · 移动优先 · 构建与发布一体化</span>
        </div>
        <nav class="nav">
          <a href="/console/dashboard" class="{% if current_path.startswith('/console/dashboard') %}active{% endif %}">
            <span class="nav-icon">D</span>
            <span class="nav-label"><strong>Dashboard</strong><span>总览与下一步</span></span>
          </a>
          <a href="/console/projects" class="{% if current_path.startswith('/console/projects') or current_path.startswith('/console/build-jobs') %}active{% endif %}">
            <span class="nav-icon">项</span>
            <span class="nav-label"><strong>项目与构建</strong><span>接入、生成、上传</span></span>
          </a>
          <a href="/console/deployments" class="{% if current_path.startswith('/console/deployments') %}active{% endif %}">
            <span class="nav-icon">发</span>
            <span class="nav-label"><strong>部署任务</strong><span>状态、日志、回滚</span></span>
          </a>
        </nav>
        <div class="sidebar-meta">
          <strong>当前用户：{{ current_user.username }}</strong>
          <span class="sidebar-copy">当前系统会保留你的侧栏展开状态。</span>
          <form method="post" action="/logout" style="margin-top:12px;">
            <button type="submit" class="secondary" style="width:100%;">退出登录</button>
          </form>
        </div>
      </aside>
      <main class="main">
        <div class="topbar">
          <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
            <button type="button" class="sidebar-toggle sidebar-toggle-mobile" data-sidebar-toggle aria-label="收起或展开侧边栏" aria-expanded="true">≡</button>
            <span class="eyebrow">{{ title }}</span>
          </div>
          <div class="topbar-meta">
            <span class="chip">当前系统：独立部署控制台</span>
            <span class="chip">主路径：接入 → 生成 → 发布</span>
          </div>
        </div>
        <div class="page">
          {% block content %}{% endblock %}
        </div>
      </main>
    </div>
    <script>
      (() => {
        const storageKey = "deploybox.sidebar.collapsed";
        const toggles = document.querySelectorAll("[data-sidebar-toggle]");
        const body = document.body;

        function applyCollapsed(collapsed) {
          body.classList.toggle("sidebar-collapsed", collapsed);
          toggles.forEach((toggle) => {
            toggle.setAttribute("aria-expanded", String(!collapsed));
            toggle.textContent = collapsed ? "→" : "≡";
          });
        }

        const saved = window.localStorage.getItem(storageKey);
        applyCollapsed(saved === "1");

        toggles.forEach((toggle) => {
          toggle.addEventListener("click", () => {
            const collapsed = !body.classList.contains("sidebar-collapsed");
            applyCollapsed(collapsed);
            window.localStorage.setItem(storageKey, collapsed ? "1" : "0");
          });
        });
      })();
    </script>
    {% else %}
      {% block auth_content %}{% endblock %}
    {% endif %}
  </body>
</html>
